name: Daily radiology technologist news update

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news.py'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_news.py

      - name: Commit updated news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html news.json daily_html
          if git diff --cached --quiet; then
            echo 'No news changes to commit.'
          else
            git commit -m 'Update daily radiology technologist news'
            # スクリプト更新と同時刻に別の実行がmainへpushしても競合しないよう、
            # push前に最新mainを取り込んでから再送する
            git fetch origin main
            git rebase origin/main
            git push
          fi
