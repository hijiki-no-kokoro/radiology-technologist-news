name: Daily radiology technologist news update

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news.py'

permissions:
  contents: write

jobs:
  update-news:
    concurrency:
      group: daily-radiology-news
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update news
        run: |
          pip install --quiet openpyxl
          python scripts/update_news.py
        env:
          # 要確認のメール通知(任意)。リポジトリの Settings > Secrets に登録したときだけ送信される
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      - name: Commit updated news and daily HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json news_meta.json seminars.json daily_html/ archive/
          for f in supply.json papers.json; do if [ -f $f ]; then git add $f; fi; done
          if git diff --cached --quiet; then
            echo 'No news changes to commit.'
          else
            git commit -m 'Update daily radiology technologist news'
            git fetch origin main
            git rebase origin/main
            git push
          fi
