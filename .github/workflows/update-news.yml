name: Daily radiology technologist news update

on:
  schedule:
    # GitHub ActionsのcronはUTC。日本時間08:00に実行する。
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news.py'

permissions:
  contents: write

jobs:
  update-news:
    concurrency:
      group: daily-radiology-news
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update news
        run: python scripts/update_news.py

      - name: Commit updated news and daily HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json daily_html/
          if git diff --cached --quiet; then
            echo 'No news changes to commit.'
          else
            git commit -m 'Update daily radiology technologist news'
            git fetch origin main
            git rebase origin/main
            git push
          fi
