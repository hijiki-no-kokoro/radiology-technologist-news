<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>イオンと化学反応式 学習アプリ｜第26版・ダッシュボード詳細修正</title>
<style>
:root{
  --bg:#fff7fc;--card:#ffffff;--ink:#35263f;--muted:#806f89;--line:#f0ddea;
  --pink:#ff6fae;--pink2:#ff9ac6;--purple:#8b72e8;--mint:#57cdb0;--yellow:#ffd86b;
  --blue:#72a9ff;--shadow:0 10px 28px rgba(170,105,160,.12)
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
  background:linear-gradient(135deg,#fff8fc 0%,#f7f4ff 48%,#f1fffb 100%);
  color:var(--ink);min-height:100vh
}
body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
body:before{width:260px;height:260px;background:#ffd8ea;opacity:.35;top:80px;right:-100px}
body:after{width:220px;height:220px;background:#d8fff4;opacity:.4;bottom:-80px;left:-70px}
header{
  background:linear-gradient(135deg,#ff6fae,#a27cf3 58%,#6fd6c1);
  color:white;padding:22px 18px 20px;position:sticky;top:0;z-index:10;
  box-shadow:0 6px 20px rgba(130,82,150,.18)
}
header h1{margin:0 0 5px;font-size:24px;letter-spacing:.02em}
header p{margin:0;opacity:.94;font-size:13px}
nav{
  display:flex;gap:8px;overflow:auto;padding:10px;background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);position:sticky;top:89px;z-index:9;
  backdrop-filter:blur(10px)
}
nav button{
  border:1px solid #eadff0;background:#fff;color:#654d70;padding:10px 14px;border-radius:999px;
  white-space:nowrap;font-weight:800;cursor:pointer;transition:.18s
}
nav button.active{background:linear-gradient(135deg,#ff6fae,#a277ef);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(184,99,166,.25)}
main{max-width:1050px;margin:auto;padding:20px}.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{
  background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:var(--shadow);position:relative;overflow:hidden
}
.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,#ff7db4,#9b7bed,#62d3b8)}
.metric{font-size:31px;font-weight:900;margin:5px 0;color:#493351}
.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.pill{
  display:inline-block;padding:5px 10px;border-radius:999px;background:#fff0f7;color:#d44c89;
  font-size:12px;font-weight:900;border:1px solid #ffd2e5
}
h2{font-size:21px;margin:8px 0 15px}h3{margin:4px 0 10px}
h2:after{content:" ✦";color:#ff78b3;font-size:16px}
button.action{
  border:0;border-radius:13px;background:linear-gradient(135deg,#ff6fae,#9a76ed);color:white;
  padding:11px 16px;font-weight:900;cursor:pointer;box-shadow:0 6px 15px rgba(174,92,155,.2)
}
button.secondary{
  border:1px solid #eaddea;background:#fff;color:#5a4764;border-radius:13px;padding:10px 14px;
  font-weight:800;cursor:pointer
}
button.danger{background:#fff2f3;color:#b93852;border-color:#f5ccd4}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.spacer{height:12px}
.notice{padding:13px;border-radius:15px;background:#fff9e8;border:1px solid #f5dfa0;color:#765a1d}
.success{background:#edfff8;border-color:#bfeedd;color:#176c54}.error{background:#fff0f4;border-color:#f3c2d3;color:#a52e55}
.progress{height:11px;background:#f2e9f1;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff70ad,#9a7cf0,#5ed1b4);border-radius:999px}
.quiz-question{font-size:21px;font-weight:900;line-height:1.55;white-space:pre-wrap}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.option{
  border:2px solid #eee1eb;background:#fff;padding:15px;border-radius:15px;text-align:left;
  font-size:16px;cursor:pointer;font-weight:700;transition:.16s
}
.option:hover{border-color:#ff9cc5;transform:translateY(-1px)}
.option.correct{border-color:#35bd9a;background:#edfff8}.option.wrong{border-color:#ed7190;background:#fff1f5}
.feedback{margin-top:14px;padding:13px;border-radius:13px;background:#f8f4fa}
input,select{border:1px solid #e6d9e7;border-radius:11px;padding:10px;font-size:15px;background:#fff}
.answerbox{width:100%;font-size:18px}
.flash{
  min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  border:0;background:linear-gradient(145deg,#fff,#fff3f9 55%,#f3f0ff);
  box-shadow:0 12px 30px rgba(176,104,159,.13);position:relative
}
.flash:before{content:"✦  ✧  ✦";position:absolute;top:18px;color:#ff80b7;letter-spacing:12px;font-size:18px}
.flash .big{font-size:45px;font-weight:950;margin:18px;color:#4d3557}
.flash .answer{font-size:31px;font-weight:950;color:#7657d4}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left}
th{color:#795d82;background:#fff8fc}
@media(max-width:650px){
  .options{grid-template-columns:1fr}.quiz-question{font-size:18px}
  main{padding:12px}header h1{font-size:21px}nav{top:79px}
  .card{border-radius:18px}.flash .big{font-size:38px}
}

.mission-card{background:linear-gradient(135deg,#fff7fb,#f6f0ff 55%,#effffc);border:2px solid #f1d7ee}
.mission-box{margin:8px 0 14px}
.mission-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mission-grid>div{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(120,80,140,.08)}
.streak{margin-top:10px;padding:10px 12px;border-radius:14px;background:#fff3c9;font-weight:700}
@media(max-width:650px){.mission-grid{grid-template-columns:1fr}}

.mission-grid button{min-height:72px;font-size:16px}.mission-grid small{font-weight:500;opacity:.8}.test-card{background:linear-gradient(135deg,#fff0f8,#fff8dc);border:2px solid #f3bfdc}.test-grade{font-size:20px;font-weight:800}.wrong-item{padding:10px;margin:8px 0;border-radius:12px;background:#fff1f4}
.today-plan-card{background:linear-gradient(135deg,#fff8ef,#f8f0ff,#effffc);border:2px solid #ead7f4}
.plan-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.plan-summary>div{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 4px 14px rgba(100,70,120,.08)}
.plan-summary b{display:block;font-size:19px}.plan-summary span{font-size:12px;color:#777}
@media(max-width:700px){.plan-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

.hint-btn,.teacher-btn{margin:6px 6px 10px 0;border:0;border-radius:999px;padding:8px 13px;background:#fff0b8;cursor:pointer;font-weight:700}
.teacher-btn{background:#e9dcff}
.hint-box{display:none;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:#f8f5ff}
.hint-box.show{display:block}
.weak-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:9px 0;border-bottom:1px solid #eee}
.weak-row b{color:#d84b76}.weak-row small{color:#888}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{padding:10px;border-radius:14px;background:#fff5c8;text-align:center;font-weight:700}

.progress-ring-wrap{display:flex;align-items:center;gap:16px;margin:12px 0}
.progress-ring{--p:0;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff78ad calc(var(--p)*1%),#f0e8f0 0)}
.progress-ring>div{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.progress-ring b{font-size:16px}.progress-ring small{font-size:9px;color:#888}.progress-big{font-size:22px;font-weight:800}
.badge.locked{filter:grayscale(1);opacity:.45}

.balance-card{background:linear-gradient(135deg,#f4f0ff,#fff8e8);text-align:center}
.balance-eq{font-size:26px;font-weight:800;padding:22px 8px;line-height:1.7}
.balance-check{margin:14px 0;padding:12px;border-radius:14px;background:#fff;border:1px dashed #d7c9e8;text-align:left}

/* 第8版改善版: quiz visibility safeguard */
#quiz .quiz-card,
#quiz .quiz-body,
#quiz .choices,
#quiz .quiz-question,
#quiz .quiz-options,
#quiz .question-area { visibility: visible; }
#quiz .quiz-card[style*="display:none"],
#quiz .quiz-body[style*="display:none"],
#quiz .choices[style*="display:none"] { display: block !important; }


/* 第9版: ion puzzle */
.puzzle-wrap{max-width:760px;margin:0 auto}
.puzzle-card{background:rgba(255,255,255,.96);border:1px solid #dbe5f2;border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(40,70,110,.10)}
.puzzle-ions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.puzzle-ion{border-radius:18px;padding:18px;text-align:center;border:2px solid #dce7f5;background:#f8fbff}
.puzzle-ion .name{font-size:14px;font-weight:700}

.puzzle-ion.cation{border-color:#b9d9ff;background:#f1f8ff}

.puzzle-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}

.puzzle-charge{text-align:center;padding:15px;border-radius:16px;background:#f7fafc;font-size:18px;font-weight:800;margin:14px 0}

.puzzle-result .big{font-size:34px;font-weight:900;margin:8px 0}

.puzzle-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.puzzle-primary{background:#2563eb;color:white}

@media(max-width:600px){.puzzle-ions,.puzzle-controls{grid-template-columns:1fr}}


/* 第10版: balance input */
.balance-input-wrap{max-width:820px;margin:0 auto}
.balance-input-card{background:rgba(255,255,255,.97);border:1px solid #dbe5f2;border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(40,70,110,.10)}
.balance-progress{text-align:center;color:#64748b;font-size:13px;margin-bottom:10px}

.balance-part{display:inline-flex;align-items:center;gap:5px}

.balance-species{white-space:nowrap}
.balance-atom-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.balance-atom-table th,.balance-atom-table td{border:1px solid #e2e8f0;padding:9px;text-align:center}
.balance-atom-table th{background:#f8fafc}
.balance-ok{font-weight:900}
.balance-bad{font-weight:900}
.balance-hint{background:#fff8e8;border:1px solid #f2d48a;border-radius:16px;padding:14px;margin-top:14px;line-height:1.7}
.balance-result{background:#eefbf3;border:2px solid #bce8cb;border-radius:18px;padding:18px;margin-top:16px;text-align:center}
.balance-result .big{font-size:30px;font-weight:900;margin:8px}
.balance-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.balance-actions button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}
.balance-primary{background:#2563eb;color:#fff}
.balance-secondary{background:#e8eef7;color:#1e293b}
.balance-feedback{text-align:center;font-weight:800;margin-top:10px}


/* 第11版: weak training */
.weak-wrap{max-width:820px;margin:0 auto}.weak-card{background:rgba(255,255,255,.97);border:1px solid #dbe5f2;border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(40,70,110,.10)}
.weak-hero{border-radius:18px;padding:18px;background:linear-gradient(135deg,#fff1f7,#eef4ff);margin-bottom:16px}.weak-rank{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.weak-rank-item{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:12px;text-align:center}.weak-rank-item .pct{font-size:25px;font-weight:900}

.weak-feedback{padding:14px;border-radius:15px;margin-top:12px;line-height:1.7}.weak-good{background:#effcf3;border:1px solid #b8e8c5}.weak-ng{background:#fff1f2;border:1px solid #fecaca}.weak-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.weak-actions button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}.weak-primary{background:#7c3aed;color:#fff}.weak-secondary{background:#e8eef7;color:#1e293b}.weak-empty{text-align:center;padding:30px;color:#64748b}@media(max-width:650px){.weak-rank{grid-template-columns:1fr}}


/* 第12版: test analysis */
.test-result-wrap{max-width:900px;margin:0 auto}.test-result-card{background:rgba(255,255,255,.97);border:1px solid #dbe5f2;border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(40,70,110,.10)}
.test-score{text-align:center;padding:20px;border-radius:20px;background:linear-gradient(135deg,#fff1f7,#eef4ff);margin-bottom:16px}.test-score .num{font-size:56px;font-weight:900;line-height:1}.test-score .sub{color:#64748b;margin-top:8px}

<script>
const IONS=[
["水素イオン","H⁺"],["ナトリウムイオン","Na⁺"],["カリウムイオン","K⁺"],["アンモニウムイオン","NH₄⁺"],
["マグネシウムイオン","Mg²⁺"],["カルシウムイオン","Ca²⁺"],["銅(II)イオン","Cu²⁺"],["亜鉛イオン","Zn²⁺"],

];

["鉄と硫黄の化合","Fe + S → FeS"],["亜鉛と塩酸","Zn + 2HCl → ZnCl₂ + H₂"],
["塩酸と水酸化ナトリウム","HCl + NaOH → NaCl + H₂O"],
["炭酸カルシウムと塩酸","CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂"],

["炭酸水素ナトリウムの熱分解","2NaHCO₃ → Na₂CO₃ + H₂O + CO₂"]

const KEY="ionChemStudyV1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  cards:{},sessions:[],quiz:{},settings:{notify:true,notifyHour:20},lastNotice:""
};
let mode="quiz", quizSet=[], qi=0, answered=false, flashList=[], fi=0, flashRevealed=false, timerStart=null, timer=null, testMode=false, testAnswers=[];

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(ts){return new Date(ts).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function dueCount(){return Object.values(state.cards).filter(c=>c.due<=Date.now()).length}
function cardKey(kind,a,b){return kind+"|"+a+"|"+b}
function card(kind,a,b){let k=cardKey(kind,a,b);return state.cards[k]||(state.cards[k]={kind,a,b,box:0,due:Date.now(),seen:0,correct:0,wrong:0,last:null});}
function reviewAfter(c,ok){
  const intervals=[1,3,7,14,30,60];
  if(ok){c.box=Math.min(c.box+1,intervals.length); c.correct++; c.due=Date.now()+intervals[Math.max(0,c.box-1)]*86400000}
  else {c.box=0;c.wrong++;c.due=Date.now()+10*60*1000}
  c.seen++;c.last=Date.now();save();
}
function adaptiveReviewAfter(c,ok){
 const base=[1,3,7,14,30,60];
 c.seen=(c.seen||0)+1;
 if(ok){
   c.correct=(c.correct||0)+1;c.wrong=c.wrong||0;
   c.streak=(c.streak||0)+1;
   const idx=Math.min(base.length-1,Math.max(0,c.box||0));
   const boost=c.streak>=2?1.5:1;
   c.box=Math.min(c.box+1,base.length);
   const days=base[Math.max(0,c.box-1)]*boost;
   c.due=Date.now()+days*86400000;
 }else{
   c.wrong=(c.wrong||0)+1;c.streak=0;c.box=0;
   const mins=c.wrong>=3?5:10;
   c.due=Date.now()+mins*60000;
 }
 c.last=Date.now();save();
}
function hintFor(x){
 const q=x.q||"";
 if(x.kind==="ion") return "💡 ヒント：陽イオンと陰イオンの電荷に注目。＋と－、数字の位置を確認しよう。";
 if(x.kind==="formula") return "💡 ヒント：元素記号の大文字・小文字と、右下の数字に注目。";
 if(x.kind==="reaction") return "💡 ヒント：反応物は「→」の左、生成物は右。原子の数が左右で同じになるように係数を考えよう。";
 return "💡 ヒント：まず問題文のキーワードを1つ拾って、分かるところから考えよう。";
}

}

}

function getProgress(){

 let streak=0, d=new Date();
 while(days.has(d.toISOString().slice(0,10))){
  streak++; d.setDate(d.getDate()-1);
 }
 const xp=state.xp||0, level=Math.floor(xp/500)+1;
 return {streak,xp,level,next:level*500};
}

function buildTodayPlan(){
 const now=Date.now();
 const due=Object.values(state.cards||{}).filter(c=>c.due<=now).sort((a,b)=>a.due-b.due);
 const wrong=(state.wrongQuestions||[]).slice().sort((a,b)=>(b.miss||0)-(a.miss||0));
 const used=new Set();
 const plan=[];
 const pushUnique=(item)=>{
   const k=item.key||item.kind+"|"+item.a+"|"+item.b;
   if(!used.has(k)){used.add(k);plan.push(item);}
 };
 // 1) due cards: prioritize overdue
 due.slice(0,5).forEach(pushUnique);
 // 2) weak questions
 wrong.slice(0,5).forEach(w=>pushUnique(w));
 // 3) add a small new mix so the learner progresses
 const fresh=shuffle(makeQuestions()).filter(q=>{
   const k=questionKey(q);
   return !wrong.some(w=>w.key===k);
 });
 fresh.slice(0,7).forEach(q=>pushUnique(q));
 return plan.slice(0,17);
}

function balanceFormulaAtoms(f){
  const clean=f.replace(/[₀₁₂₃₄₅₆₇₈₉]/g,m=>"0123456789"["₀₁₂₃₄₅₆₇₈₉".indexOf(m)])
    .replace(/²/g,"2").replace(/³/g,"3").replace(/⁴/g,"4").replace(/⁵/g,"5")
    .replace(/⁶/g,"6").replace(/⁷/g,"7").replace(/⁸/g,"8").replace(/⁹/g,"9");
  const result={};
  function parsePart(s,mult=1){
    const re=/([A-Z][a-z]?)(\d*)/g; let m;
    while((m=re.exec(s))){
      const el=m[1], n=m[2]?parseInt(m[2]):1;
      result[el]=(result[el]||0)+n*mult;
    }
  }
  // Middle-school set used here has Ca(OH)2 as the only parenthesized formula.
  const par=/^\s*([A-Z][a-z]?)(\((?:[A-Z][a-z]?)(?:\d*)\))(\d+)\s*$/.exec(clean);
  if(par){
    const outer=par[1], inside=par[2].slice(1,-1), mult=parseInt(par[3]);
    parsePart(outer); parsePart(inside,mult); return result;
  }
  parsePart(clean); return result;
}
function getBalanceCounts(p, vals){
  const left={}, right={};
  const add=(target,formula,coef)=>{
    const a=balanceFormulaAtoms(formula);
    Object.keys(a).forEach(e=>target[e]=(target[e]||0)+a[e]*coef);
  };
  p.react.forEach((x,i)=>add(left,x[0],Number(vals[i])||0));
  p.prod.forEach((x,i)=>add(right,x[0],Number(vals[p.react.length+i])||0));
  return {left,right};
}
function balanceIsSolved(p,vals){
  if(vals.some(v=>!Number.isInteger(Number(v))||Number(v)<1)) return false;
  const c=getBalanceCounts(p,vals);
  const atoms=p.atoms;
  return atoms.every(e=>(c.left[e]||0)===(c.right[e]||0));
}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQuestions(){
 let qs=[];

 // =========================
 // イオン：基本＋逆向き＋電荷
 // =========================
 IONS.forEach(([n,f])=>{
   const ionNames=IONS.filter(x=>x[0]!==n).map(x=>x[0]);
   const ionForms=IONS.filter(x=>x[1]!==f).map(x=>x[1]);
   qs.push({type:"choice",q:`「${n}」のイオン式はどれ？`,ans:f,choices:shuffle([f,...shuffle(ionForms).slice(0,3)]),kind:"ion"});
   qs.push({type:"choice",q:`「${f}」が表すイオン名はどれ？`,ans:n,choices:shuffle([n,...shuffle(ionNames).slice(0,3)]),kind:"ion"});
   qs.push({type:"choice",q:`「${n}」の電荷はどれ？`,ans:(f.match(/[⁺⁻²³⁴⁵]/g)||[]).join(""),choices:shuffle([
     (f.match(/[⁺⁻²³⁴⁵]/g)||[]).join(""),
     "＋","－","2＋"
   ]),kind:"ion"});
   qs.push({type:"tf",q:`「${n}」は「${f}」で表される。`,ans:"正しい",choices:["正しい","誤り"],kind:"ion"});
   qs.push({type:"tf",q:`「${f}」は「${n}」を表す。`,ans:"正しい",choices:["正しい","誤り"],kind:"ion"});
   qs.push({type:"text",q:`「${n}」のイオン式を書いて。`,ans:f,kind:"ion"});
 });

 // =========================
 // 化学式：基本＋逆向き＋正誤
 // =========================
 FORMULAS.forEach(([n,f])=>{
   const names=FORMULAS.filter(x=>x[0]!==n).map(x=>x[0]);
   const forms=FORMULAS.filter(x=>x[1]!==f).map(x=>x[1]);
   qs.push({type:"choice",q:`「${n}」の化学式はどれ？`,ans:f,choices:shuffle([f,...shuffle(forms).slice(0,3)]),kind:"formula"});
   qs.push({type:"choice",q:`「${f}」は何という物質？`,ans:n,choices:shuffle([n,...shuffle(names).slice(0,3)]),kind:"formula"});
   qs.push({type:"tf",q:`「${n}」の化学式は「${f}」である。`,ans:"正しい",choices:["正しい","誤り"],kind:"formula"});
   qs.push({type:"text",q:`「${n}」の化学式を書いて。`,ans:f,kind:"formula"});
 });

 // =========================
 // 化学反応式：正誤・記述・係数・生成物
 // =========================
 REACTIONS.forEach(([n,f])=>{
   qs.push({type:"tf",q:`次の化学反応式は正しい？\n${f}`,ans:"正しい",choices:shuffle(["正しい","誤り"]),kind:"reaction"});

   const bad=f.replace(/(^|[ +])2(?=[A-Z])/,"$13");
   if(bad!==f){
     qs.push({type:"tf",q:`次の化学反応式は正しい？\n${bad}`,ans:"誤り",choices:shuffle(["正しい","誤り"]),kind:"reaction"});
   }

   qs.push({type:"text",q:`次の反応を化学反応式で表して。\n${n}`,ans:f,kind:"reaction"});

   const parts=f.split(" → ");
   if(parts.length===2){
     const lhs=parts[0],rhs=parts[1];
     const firstR=rhs.split(" + ")[0];
     qs.push({type:"choice",q:`「${n}」で、生成物のうち最初に書かれている物質は？`,
       ans:firstR,choices:shuffle([firstR,...REACTIONS.filter(x=>x[0]!==n).map(x=>x[1].split(" → ")[1].split(" + ")[0]).slice(0,3)]),kind:"reaction"});
     const firstL=lhs.split(" + ")[0];
     qs.push({type:"choice",q:`「${n}」で、反応物のうち最初に書かれている物質は？`,
       ans:firstL,choices:shuffle([firstL,...REACTIONS.filter(x=>x[0]!==n).map(x=>x[1].split(" → ")[0].split(" + ")[0]).slice(0,3)]),kind:"reaction"});
     qs.push({type:"text",q:`「${n}」の化学反応式を完成させて。\n${lhs} → ？`,ans:f,kind:"reaction"});
   }
 });

 // 総合問題：イオン・化学式・反応式を混ぜる
 IONS.slice(0,10).forEach(([n,f])=>{
   qs.push({type:"choice",q:`総合：${n}を表す式として正しいものは？`,ans:f,
     choices:shuffle([f,...shuffle(IONS.filter(x=>x[1]!==f).map(x=>x[1])).slice(0,3)]),kind:"総合"});
 });
 FORMULAS.slice(0,10).forEach(([n,f])=>{
   qs.push({type:"choice",q:`総合：${f}という化学式の物質名は？`,ans:n,
     choices:shuffle([n,...shuffle(FORMULAS.filter(x=>x[0]!==n).map(x=>x[0])).slice(0,3)]),kind:"総合"});
 });

 return shuffle(qs);
}

const WEAK_TRAINING_SIZE=10;

function buildWeakTraining(){
  const all=makeQuestions();
  const ranked=typeof getWeakRank==="function"?getWeakRank():[];
  const scoreMap={}; ranked.forEach(x=>scoreMap[x.category]=x);
  const cats=["イオン","化学式","反応式","総合"].sort((a,b)=>(scoreMap[a]?.acc??100)-(scoreMap[b]?.acc??100));
  const picked=[];
  cats.forEach(cat=>all.filter(q=>q.cat===cat).forEach(q=>{if(picked.length<WEAK_TRAINING_SIZE)picked.push(q);}));
  all.forEach(q=>{if(picked.length<WEAK_TRAINING_SIZE&&!picked.includes(q))picked.push(q);});

function dash17LocalDate(ts){

function dashboard17Data(){
  const cats=["イオン","化学式","反応式","総合"];
  const qlog=Object.values((state&&state.quiz)||{});
  const domain={};
  cats.forEach(c=>domain[c]={correct:0,total:0});
  qlog.forEach(x=>{
    const c=x.cat||"総合";
    if(!domain[c])domain[c]={correct:0,total:0};
    const total=Number(x.total)||0,correct=Number(x.correct)||0;
    domain[c].total+=total;domain[c].correct+=correct;
  });
  // wrongQuestionsから現在の弱点数を集計
  const wrong=Object.values((state&&state.wrongQuestions)||{});
  const wrongCat={};
  wrong.forEach(x=>{const c=x.cat||"総合";wrongCat[c]=(wrongCat[c]||0)+1;});
  const accs=cats.map(c=>domain[c].total?Math.round(domain[c].correct/domain[c].total*100):0);
  const active=accs.filter(x=>x>0);
  const overall=active.length?Math.round(active.reduce((a,b)=>a+b,0)/active.length):0;
  let level="学習スタート",desc="まずは基礎問題を少し解いて、現在地を作りましょう。";

  else if(overall>=80){level="標準クリア";desc="標準問題がかなり安定。応用問題を増やす段階です。";}
  else if(overall>=70){level="基礎安定";desc="基本は身についてきています。苦手分野を重点的に復習しましょう。";}
  else if(overall>=50){level="土台づくり";desc="まず基礎問題を固めると、得点が伸びやすい段階です。";}
  const weakest=cats.slice().sort((a,b)=>{
    const aa=domain[a].total?domain[a].correct/domain[a].total:0;
    const bb=domain[b].total?domain[b].correct/domain[b].total:0;
    return aa-bb;
  })[0];
  const strongest=cats.slice().sort((a,b)=>{

/* 第21版：学習履歴・成長グラフ */
let growth21Range=7;

function growth21DateKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function growth21Short(d){
  return (d.getMonth()+1)+"/"+d.getDate();
}
function growth21Build(){
  const days=[],now=new Date();
  for(let i=growth21Range-1;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d);}
  const cats=["イオン","化学式","反応式","総合"];
  const byDay={};
  days.forEach(d=>byDay[growth21DateKey(d)]={total:0,correct:0,cats:{}});
  cats.forEach(c=>days.forEach(d=>byDay[growth21DateKey(d)].cats[c]={total:0,correct:0}));
  const qlog=Object.values((state&&state.quiz)||{});
  qlog.forEach(x=>{
    const ts=Number(x.ts||x.last||Date.now()),d=new Date(ts),k=growth21DateKey(d);
    if(!byDay[k])return;
    const total=Number(x.total)||0,correct=Number(x.correct)||0,c=x.cat||"総合";
    byDay[k].total+=total;byDay[k].correct+=correct;
    if(!byDay[k].cats[c])byDay[k].cats[c]={total:0,correct:0};
    byDay[k].cats[c].total+=total;byDay[k].cats[c].correct+=correct;
  });
  // セッションも学習量として補助的に集計
  const sessions=Array.isArray(state.sessions)?state.sessions:[];
  sessions.forEach(s=>{
    const k=growth21DateKey(new Date(s.ts||Date.now()));
    if(byDay[k] && !byDay[k].total)byDay[k].total+=Number(s.questions)||0;
  });
  const points=days.map(d=>{
    const x=byDay[growth21DateKey(d)],rate=x.total?Math.round(x.correct/x.total*100):null;
    return {d,total:x.total,correct:x.correct,rate,cats:x.cats};
  });
  const measured=points.filter(x=>x.rate!==null);
  const avg=measured.length?Math.round(measured.reduce((a,b)=>a+b.rate,0)/measured.length):0;
  const totalQ=points.reduce((a,b)=>a+b.total,0);
  const best=measured.length?Math.max(...measured.map(x=>x.rate)):0;
  return {points,avg,totalQ,best,cats};
}
function growth21Svg(data){
  const pts=data.points,w=760,h=250,pad={l:45,r:18,t:18,b:38};
  const x=i=>pad.l+(pts.length===1?0:i*(w-pad.l-pad.r)/(pts.length-1));
  const y=v=>pad.t+(100-v)*(h-pad.t-pad.b)/100;
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${pad.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#64748b">${v}</text>`).join("");
  let path="",circles="";
  pts.forEach((p,i)=>{if(p.rate===null)return;path+=(path?" L ":"M ")+x(i)+" "+y(p.rate);circles+=`<circle cx="${x(i)}" cy="${y(p.rate)}" r="4" fill="#6366f1"><title>${growth21Short(p.d)}：${p.rate}%</title></circle>`;});
  const labels=pts.map((p,i)=>`<text x="${x(i)}" y="${h-13}" text-anchor="middle" font-size="10" fill="#64748b">${growth21Short(p.d)}</text>`).join("");
  return `<div class="growth21-chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<path d="${path}" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${circles}${labels}</svg></div>`;
}
function renderGrowth21(){
  const el=document.getElementById("stats");if(!el)return;
  const d=growth21Build(),p=d.points;
  const domain=p.reduce((acc,x)=>{d.cats.forEach(c=>{acc[c].total+=x.cats[c].total;acc[c].correct+=x.cats[c].correct;});return acc;},Object.fromEntries(d.cats.map(c=>[c,{total:0,correct:0}])));
  const domainHtml=d.cats.map(c=>{const v=domain[c],r=v.total?Math.round(v.correct/v.total*100):0;return `<div class="growth21-domain"><b>${c}</b><div class="growth21-bar"><span style="width:${r}%"></span></div><b>${v.total?r+"%":"—"}</b></div>`}).join("");
  const history=p.slice().reverse().map(x=>`<div class="growth21-history"><b>${growth21Short(x.d)}</b><span>${x.total?x.correct+"/"+x.total+"問":"—"}</span><b>${x.rate===null?"—":x.rate+"%"}</b><span>${x.total?"学習":"未記録"}</span></div>`).join("");
  el.innerHTML=`<div class="growth21">
    <div class="growth21-head"><h2>📈 学習履歴・成長グラフ</h2><p class="growth21-note">学習した記録を日ごとに整理して、正答率と学習量の変化を確認できます。</p>
      <div class="growth21-tabs"><button class="growth21-tab ${growth21Range===7?"active":""}" onclick="setGrowth21Range(7)">7日間</button><button class="growth21-tab ${growth21Range===30?"active":""}" onclick="setGrowth21Range(30)">30日間</button></div>
      <div class="growth21-grid"><div class="growth21-stat"><small>期間平均</small><b>${d.avg}%</b></div><div class="growth21-stat"><small>学習問題</small><b>${d.totalQ}問</b></div><div class="growth21-stat"><small>最高正答率</small><b>${d.best}%</b></div><div class="growth21-stat"><small>記録日数</small><b>${p.filter(x=>x.total).length}日</b></div></div>
    </div>
    <div class="growth21-card"><h3>📊 正答率の推移</h3>${growth21Svg(d)}<div class="growth21-legend"><span><i class="growth21-dot" style="background:#6366f1"></i>総合正答率</span></div><p class="growth21-note">学習していない日はグラフをつなげず、実際に記録がある日のみ表示します。</p></div>
    <div class="growth21-card"><h3>🧪 分野別の理解度</h3>${domainHtml}</div>
    <div class="growth21-card"><h3>📅 学習履歴</h3>${history}</div>
    <p class="growth21-note">※正答率はこのアプリ内で記録された問題演習の結果から算出しています。学校の成績やテスト結果を直接予測するものではありません。</p>
  </div>`;
}

let lastTestAnalysis=null;

function domainLabel(cat){
  return cat==="イオン"?"イオン":cat==="化学式"?"化学式":cat==="反応式"?"反応式":"総合";
}
function analyzeTestResult(){
  const answers=Array.isArray(testAnswers)?testAnswers:[];
  const qs=Array.isArray(quizSet)?quizSet:[];
  const rows=qs.map((q,i)=>({q,ok:answers[i]===q.a,ans:answers[i]}));
  const cats=["イオン","化学式","反応式","総合"];
  const domains=cats.map(cat=>{
    const r=rows.filter(x=>domainLabel(x.q.cat)===cat);
    const correct=r.filter(x=>x.ok).length;
    return {cat,total:r.length,correct,acc:r.length?Math.round(correct/r.length*100):0};
  });
  const wrong=rows.filter(x=>!x.ok);
  const weakest=domains.filter(x=>x.total).sort((a,b)=>a.acc-b.acc)[0]||domains[0];
  lastTestAnalysis={rows,domains,wrong,weakest,score:rows.filter(x=>x.ok).length};
  return lastTestAnalysis;
}

 if(x.type==="choice"||x.type==="tf") body=`<div class="options">${x.choices.map((c,i)=>`<button class="option" onclick="answerQuiz(${i})">${esc(c)}</button>`).join("")}</div>`;
 else body=`<div class="spacer"></div><input id="textAns" class="answerbox" placeholder="化学反応式を入力（例：H₂ + O₂ → …）"><div class="spacer"></div><button class="action" onclick="answerText()">回答する</button>`;
 el.innerHTML=`<h2>問題演習 <span class="pill">${qi+1} / ${quizSet.length}</span></h2>
 <div class="progress"><span style="width:${pct}%"></span></div><div class="spacer"></div>
 <div class="card"><div class="quiz-question">${esc(x.q)}</div>
 <button class="hint-btn" onclick="showHint()">💡 ヒント</button><button class="teacher-btn" onclick="teacherExplain()">🧑‍🏫 先生モード</button>
 <div id="hintBox" class="hint-box"></div>${body}<div id="fb"></div></div>`;
}

function teacherExplain(){
 const x=quizSet[qi]; if(!x)return;
 let msg="";
 if(x.kind==="ion") msg="イオンは、電気を帯びた粒子です。式の右上にある＋・－と数字を確認すると整理しやすいよ。";
 else if(x.kind==="formula") msg="化学式は、元素記号と原子の個数を表しています。右下の数字はその元素の原子数です。";
 else if(x.kind==="reaction") msg="化学反応式では、反応前の物質と反応後の物質を「→」でつなぎ、左右の原子数が同じになるよう係数をそろえます。";
 else msg="問題文の条件を1つずつ整理して、分かる部分から答えを組み立てよう。";
 alert("🧪 先生モード\\n\\n"+msg);
}
function showHint(){const el=document.getElementById("hintBox");if(el){el.textContent=hintFor(quizSet[qi]);el.classList.add("show");}}
function norm(s){return String(s).replace(/\s+/g,"").replace(/→/g,"->").replace(/＝/g,"=")}
function answerQuiz(i){
 if(answered)return; answered=true; const x=quizSet[qi], chosen=x.choices[i], ok=chosen===x.ans; if(testMode)testAnswers[qi]={ok,chosen,correct:x.ans};
 document.querySelectorAll(".option").forEach((b,j)=>{if(x.choices[j]===x.ans)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});
 const fb=document.getElementById("fb"); fb.className="feedback "+(ok?"success":"error");
 fb.innerHTML=`<b>${ok?"正解":"不正解"}</b><br>正答：${esc(x.ans)}${!ok?`<br>あなたの答え：${esc(chosen)}`:""}`;
 recordQuiz(x,ok); setTimeout(()=>{qi++;answered=false;renderQuiz()},900);
}
function answerText(){
 if(answered)return; answered=true; const x=quizSet[qi], v=document.getElementById("textAns").value.trim(), ok=norm(v)===norm(x.ans); if(testMode)testAnswers[qi]={ok,chosen:v,correct:x.ans};
 const fb=document.getElementById("fb");fb.className="feedback "+(ok?"success":"error");
 fb.innerHTML=`<b>${ok?"正解":"不正解"}</b><br>正答：${esc(x.ans)}${!ok?`<br>入力：${esc(v||"（未入力）")}`:""}`;
 recordQuiz(x,ok); setTimeout(()=>{qi++;answered=false;renderQuiz()},1400);
}

function questionKey(x){return [x.kind||"",x.type||"",x.q||"",x.ans||""].join("¦")}
function rememberWrongQuestion(x){
 const k=questionKey(x);
 state.wrongQuestions??=[];
 const old=state.wrongQuestions.find(w=>w.key===k);
 if(old){old.miss=(old.miss||0)+1;old.last=Date.now();}
 else{state.wrongQuestions.push({key:k,type:x.type,kind:x.kind,q:x.q,ans:x.ans,choices:x.choices||[],miss:1,last:Date.now()});}
}
function forgetWrongQuestion(x){
 const k=questionKey(x);
 state.wrongQuestions=(state.wrongQuestions||[]).filter(w=>w.key!==k);
}
function startWrongQuiz(){
 const ws=(state.wrongQuestions||[]).sort((a,b)=>(b.miss||0)-(a.miss||0));
 if(!ws.length){alert("今は間違えた問題がありません。いい調子です！");return;}
 quizSet=shuffle(ws).slice(0,10).map(w=>({...w}));
 qi=0;answered=false;setView("quiz");
}

function recordQuiz(x,ok){
 const k=x.kind+"|quiz";
 state.quiz[k]??={n:0,ok:0};state.quiz[k].n++;if(ok)state.quiz[k].ok++;
 const c=card("quiz",x.q,x.ans);
 adaptiveReviewAfter(c,ok);
 if(ok) forgetWrongQuestion(x); else rememberWrongQuestion(x);
 addXP(ok?10:2); addTodayQuestions(1);
 save();
}
function startFlash(){
 flashList=shuffle([...IONS.map(x=>["イオン",...x]),...FORMULAS.map(x=>["化学式",...x])]);
 fi=0;flashRevealed=false;setView("flash");
}
function renderFlash(){
 const el=document.getElementById("flash");
 if(!flashList.length){el.innerHTML=`<div class="card"><h2>1対1単語帳</h2><button class="action" onclick="startFlash()">開始</button></div>`;return}
 const [kind,a,b]=flashList[fi];
 el.innerHTML=`<h2>1対1単語帳 <span class="pill">${fi+1} / ${flashList.length}</span></h2>
 <div class="card flash"><div class="pill">${kind}</div><div class="big">${esc(a)}</div>
 ${flashRevealed?`<div class="answer">${esc(b)}</div>`:`<button class="action" onclick="revealFlash()">答えを見る</button>`}</div>
 ${flashRevealed?`<div class="row" style="justify-content:center;margin-top:12px"><button class="secondary" onclick="gradeFlash(false)">もう一回！</button><button class="action" onclick="gradeFlash(true)">覚えた！</button></div>`:""}`;
}
function revealFlash(){flashRevealed=true;renderFlash()}
function gradeFlash(ok){
 const [kind,a,b]=flashList[fi];reviewAfter(card(kind,a,b),ok);fi++;
 if(fi>=flashList.length){alert("単語帳1周完了！");flashList=[];setView("home")}else{flashRevealed=false;renderFlash()}
}
function renderReview(){
 const due=Object.values(state.cards).filter(c=>c.due<=Date.now()).sort((a,b)=>a.due-b.due);
 const upcoming=Object.values(state.cards).filter(c=>c.due>Date.now()).sort((a,b)=>a.due-b.due).slice(0,12);
 document.getElementById("review").innerHTML=`<h2>復習予定</h2>
 <div class="grid"><div class="card"><div class="muted">今すぐ復習</div><div class="metric">${due.length}枚</div><button class="action" onclick="startDue()">復習開始</button></div>
 <div class="card"><div class="muted">次の復習</div><div class="metric">${upcoming[0]?fmtDate(upcoming[0].due):"—"}</div></div></div>
 <div class="spacer"></div><div class="card"><h3>今日の復習カード</h3>
 ${due.length?`<table><tr><th>内容</th><th>段階</th><th>前回</th></tr>${due.slice(0,30).map(c=>`<tr><td>${esc(c.a)} → ${esc(c.b)}</td><td>${c.box}</td><td>${c.last?fmtDate(c.last):"初回"}</td></tr>`).join("")}</table>`:"<p class='muted'>今日は復習待ちカードはありません。</p>"}
 </div>
 <div class="spacer"></div><div class="card"><h3>次回以降の予定カード</h3>
 ${upcoming.length?`<table><tr><th>内容</th><th>段階</th><th>次回</th></tr>${upcoming.map(c=>`<tr><td>${esc(c.a)} → ${esc(c.b)}</td><td>${c.box}</td><td>${fmtDate(c.due)}</td></tr>`).join("")}</table>`:"まだカードがありません。単語帳から学習してください。"}</div>
 <div class="spacer"></div><div class="notice">復習間隔：1日 → 3日 → 7日 → 14日 → 30日 → 60日。間違えたカードは10分後に再復習します。</div>`;
}
function startDue(){
 const due=Object.values(state.cards).filter(c=>c.due<=Date.now()).sort((a,b)=>a.due-b.due);
 if(!due.length){alert("今すぐ復習するカードはありません。");return}
 flashList=shuffle(due.slice(0,20).map(c=>[c.kind,c.a,c.b]));fi=0;flashRevealed=false;setView("flash");
}
function renderStats(){
 const all=Object.values(state.quiz), n=all.reduce((a,x)=>a+x.n,0), ok=all.reduce((a,x)=>a+x.ok,0);
 const accuracy=n?Math.round(ok/n*100):0;
 const days=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10);return [k,state.sessions.filter(s=>new Date(s.ts).toISOString().slice(0,10)===k).reduce((a,s)=>a+s.sec,0)]});
 document.getElementById("stats").innerHTML=`<h2>学習記録</h2>
 <div class="card"><div class="muted">問題バンク</div><div class="metric">${makeQuestions().length}問+</div></div><div class="grid"><div class="card"><div class="muted">問題数</div><div class="metric">${n}</div></div><div class="card"><div class="muted">正答率</div><div class="metric">${accuracy}%</div></div><div class="card"><div class="muted">累計時間</div><div class="metric">${totalMinutes()}分</div></div></div>
 <div class="spacer"></div><div class="card"><h3>📈 昨日との比較</h3>
 ${(()=>{const t=today(),d=new Date();d.setDate(d.getDate()-1);const y=d.toISOString().slice(0,10);
 const tc=(state.quizToday||{})[t]||0,yc=(state.quizToday||{})[y]||0;
 const diff=tc-yc; return `<div class="metric">${diff>=0?"+":""}${diff}問</div><p class="muted">今日の回答数 − 昨日の回答数</p>`})()}
 </div><div class="spacer"></div><div class="card"><h3>直近7日間</h3>${days.map(x=>`<div style="margin:9px 0"><div class="row" style="justify-content:space-between"><span>${x[0]}</span><span>${Math.round(x[1]/60)}分</span></div><div class="progress"><span style="width:${Math.min(100,x[1]/60*5)}%"></span></div></div>`).join("")}</div>
 <div class="spacer"></div><div class="card"><h3>現在の苦手問題</h3>
 <p class="muted">間違えると自動でここに追加され、正解すると外れます。</p>
 <div class="metric">${(state.wrongQuestions||[]).length}問</div>
 <button class="action" onclick="startWrongQuiz()">❌ 苦手問題を解く</button></div>
 <div class="spacer"></div><div class="card"><h3>🔴 苦手ランキング</h3>
 ${getWeakRank().map((x,i)=>`<div class="weak-row"><span>${i+1}. ${esc(x.name)}</span><b>${x.acc}%</b><small>${x.n}問</small></div>`).join("")||"<p>まだ十分なデータがありません。</p>"}
 </div><div class="spacer"></div><div class="card"><h3>分野別</h3><table><tr><th>分野</th><th>問題</th><th>正答</th><th>正答率</th></tr>${Object.entries(state.quiz).map(([k,v])=>`<tr><td>${k.split("|")[0]}</td><td>${v.n}</td><td>${v.ok}</td><td>${v.n?Math.round(v.ok/v.n*100):0}%</td></tr>`).join("")||"<tr><td colspan=4>まだ記録がありません</td></tr>"}</table></div>`;
}
function renderSettings(){
 const perm=("Notification" in window)?Notification.permission:"unsupported";
 document.getElementById("settings").innerHTML=`<h2>設定</h2>
 <div class="card"><h3>復習通知</h3><p class="muted">復習時刻になると、ブラウザ通知を試みます。通知はブラウザ/端末側の許可が必要です。</p>
 <div class="row"><label>通知時刻 <input id="notifyHour" type="number" min="0" max="23" value="${state.settings.notifyHour}"> 時</label>
 <button class="action" onclick="saveSettings()">保存</button>
 <button class="secondary" onclick="requestNotify()">通知を許可する</button>
 <button class="secondary" onclick="testNotification()">通知テスト</button></div>
 <p class="small">現在の通知権限：${perm}</p>
 <div class="notice success">設定時刻以降にアプリを開いていると、当日の復習カード枚数を自動確認し、「今日は○枚の復習があります」と通知します。</div></div>
 <div class="spacer"></div><div class="card"><h3>データ</h3><div class="row"><button class="secondary" onclick="exportData()">学習データを書き出す</button><button class="secondary" onclick="importData()">学習データを読み込む</button><button class="secondary danger" onclick="resetData()">全データをリセット</button></div></div>
 <div class="spacer"></div><div class="notice">このHTMLを「ファイルをダブルクリック」で開いた場合、ブラウザによってはバックグラウンド通知が制限されます。通知を安定して使うには、HTTPSで公開するか、対応するローカルサーバー/インストール型Webアプリとして使う方法が適しています。</div>`;
}
function saveSettings(){state.settings.notifyHour=Math.max(0,Math.min(23,Number(document.getElementById("notifyHour").value)||20));save();alert("設定を保存しました。")}
function exportData(){const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(state));a.download="化学学習データ.json";a.click()}
function importData(){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();renderHome();alert("読み込みました。")}catch(e){alert("読み込みに失敗しました。")}};r.readAsText(f)};i.click()}
function resetData(){if(confirm("学習記録とカード進捗をすべて削除します。よろしいですか？")){localStorage.removeItem(KEY);location.reload()}}
navInit();renderHome();setInterval(notifyIfDue,60000);
</script>
