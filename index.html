<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>診療放射線技師ニュース</title>
<meta name="description" content="診療放射線技師向けに、制度・安全管理・学会のお知らせ・装置の話題を毎朝まとめています。">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="技師ニュース">
<meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2030" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="診療放射線技師ニュース">
<meta property="og:description" content="制度・安全情報・研修の案内・装置の話題を毎朝まとめて確認できます。">
<meta property="og:url" content="https://hijiki-no-kokoro.github.io/radiology-technologist-news/">
<meta property="og:image" content="https://hijiki-no-kokoro.github.io/radiology-technologist-news/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem("rtn-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* ---- 色: 病院のシーツのような青みの白と、やわらかい紺。要確認はローズ、お知らせははちみつ色 ---- */
:root{
  color-scheme:light;
  --bg:#f3f5fb;          /* シーツの白 */
  --surface:#ffffff;
  --surface-2:#eaeef8;
  --line:#dbe1ee;
  --ink:#2d3550;         /* やわらかい紺(本文) */
  --ink-soft:#66708c;
  --blue:#5571d8;        /* 検査着のブルー(操作・リンク) */
  --blue-soft:#e3e9fb;
  --rose:#d9536f;        /* 要確認 */
  --rose-soft:#fde8ec;
  --honey:#b67a10;       /* お知らせ */
  --honey-soft:#fdf1d8;
  --sage:#5f8f76;        /* 話題 */
  --sage-soft:#e4f1ea;
  --bubble:#fff7f8;
  --on-blue:#ffffff;
  --shadow:0 6px 18px rgba(45,53,80,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1b2030; --surface:#242a3d; --surface-2:#2c3349; --line:#384059;
  --ink:#e7eaf4; --ink-soft:#a5adc6;
  --blue:#93a8f5; --blue-soft:#323c5e;
  --rose:#f28da2; --rose-soft:#46293a;
  --honey:#f0c062; --honey-soft:#43392a;
  --sage:#93c4aa; --sage-soft:#2b3d39;
  --bubble:#2f2a3a; --on-blue:#1b2030; --shadow:0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1b2030; --surface:#242a3d; --surface-2:#2c3349; --line:#384059;
  --ink:#e7eaf4; --ink-soft:#a5adc6;
  --blue:#93a8f5; --blue-soft:#323c5e;
  --rose:#f28da2; --rose-soft:#46293a;
  --honey:#f0c062; --honey-soft:#43392a;
  --sage:#93c4aa; --sage-soft:#2b3d39;
  --bubble:#2f2a3a; --on-blue:#1b2030; --shadow:0 6px 18px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* ---- あいさつ ---- */
.hello{padding:28px 0 18px}
.hello-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin:0;min-width:0;white-space:nowrap}
@media (max-width:420px){.brand .bn{display:none}.brand .bs{display:inline!important}}
.brand svg{flex-shrink:0}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-soft);cursor:pointer}
.themebtn:hover{color:var(--ink)}
.hello h1{font-size:clamp(26px,6vw,34px);font-weight:900;line-height:1.35;margin:14px 0 4px;letter-spacing:.01em}
.hello .sub{margin:0;color:var(--ink-soft);font-size:14px}
.hello-tools{display:flex;gap:6px;flex-shrink:0}
.pill.focus{background:transparent;color:var(--blue);border:1px solid var(--blue);padding:0 9px}
.chips button.is-focus::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:6px;vertical-align:middle}
.chips button.is-focus[aria-pressed="true"]::before{background:var(--on-blue)}
dialog.settings{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:20px;max-width:420px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog.settings::backdrop{background:rgba(27,32,48,.35)}
dialog.settings h2{margin:0 0 4px;font-size:18px}
dialog.settings p{margin:0 0 14px;color:var(--ink-soft);font-size:13.5px}
.focus-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.focus-grid label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.focus-grid input{accent-color:var(--blue);width:16px;height:16px;margin:0}
.focus-grid label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.memo{margin-top:8px}
.memo textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
.memo textarea:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.memo-line{margin-top:6px;font-size:13px;color:var(--ink-soft)}
.memo-line b{color:var(--ink);font-weight:700;margin-right:4px}
.stale{margin:12px 0 0;background:var(--honey-soft);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13.5px}
.stale b{color:var(--honey)}
.hello h1 .wd{font-size:.55em;font-weight:700;color:var(--ink-soft);margin-left:.5em;letter-spacing:.04em}

/* ---- 検索と絞り込み(スクロールしても上に残る) ---- */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0 8px;border-bottom:1px solid transparent}
.bar.stuck{border-bottom-color:var(--line)}
.bar-row{display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;position:relative;display:block}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 38px 10px 40px;font:inherit;font-size:15px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--ink-soft)}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--ink-soft);display:none}
.search .clear.show{display:block}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;flex-shrink:0}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
@media (max-width:640px){.bar-row{flex-wrap:wrap;gap:8px}.search{flex-basis:100%}.seg{width:100%}.seg button{flex:1;padding:6px 8px}}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(45,53,80,.15)}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.chips button .n{margin-left:5px;font-size:12px;opacity:.8}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
@media (min-width:720px){.chips{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding-left:0;padding-right:0}}

/* ---- レイアウト ---- */
.layout{display:grid;gap:26px;padding:18px 0 40px}
@media (min-width:960px){.layout.recent{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}}
.section h2{font-size:19px;font-weight:700;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.section h2 .count{font-family:"BIZ UDPGothic",sans-serif;font-size:13px;font-weight:400;color:var(--ink-soft)}
.section .lead{margin:0 0 12px;color:var(--ink-soft);font-size:13.5px}
.section+.section{margin-top:28px}

/* 確認しておきたいこと: このページでいちばん目立たせる部分 */
.must{display:grid;gap:14px}
.must-item{background:var(--surface);border-radius:20px;padding:16px 18px 18px 22px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.must-item::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 5px 5px 0;background:var(--rose)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;line-height:1.7}
.pill.hi{background:var(--rose-soft);color:var(--rose)}
.pill.mid{background:var(--honey-soft);color:var(--honey)}
.pill.lo{background:var(--sage-soft);color:var(--sage)}
.pill.cat{background:var(--surface-2);color:var(--ink-soft);font-weight:400}
.title{font-size:15.5px;font-weight:700;line-height:1.6;margin:0;text-decoration:none;display:block}
.title:hover{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.must-item .title{font-size:17.5px}
.src{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.sum{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}

/* 記事ごとのポイント(吹き出し) */
.note{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.note .face{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:14px}
.note .say{margin:0;background:var(--bubble);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:14px;line-height:1.65}
.note.shared{margin:0 0 12px}
.note .say small{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:1px}

/* お知らせ・ほかのニュース: 落ち着いた一覧 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .note{margin-top:8px}
.row .note .face{width:26px;height:26px;font-size:12px}
.row .note .say{font-size:13.5px;padding:6px 10px}
.pill.new{background:var(--blue);color:var(--on-blue)}
.save{margin-left:auto;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;cursor:pointer;min-height:28px}
.save:hover{color:var(--ink);border-color:var(--blue)}
.save[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue);font-weight:700}
.save svg{width:14px;height:14px}
.save[aria-pressed="true"] svg path{fill:currentColor}
.saved-tools{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
/* これからの日程 */
.sched{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sched-item{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.sched-item:first-child{border-top:0}
.sched-date{text-align:center;background:var(--surface-2);border-radius:12px;padding:6px 0 5px;line-height:1.2}
.sched-date .md{display:block;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:18px}
.sched-date .wd{display:block;font-size:11.5px;color:var(--ink-soft)}
.sched-date.deadline{background:var(--honey-soft)}
.sched-date.deadline .md{color:var(--honey)}
.sched-body .kind{font-size:12px;color:var(--ink-soft)}
.sched-body .kind b{color:var(--honey);font-weight:700}
.sched-body .title{font-size:14.5px}
.sched-tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:12.5px}
.pill.near{background:var(--sage-soft);color:var(--sage)}
.pill.place{background:var(--surface-2);color:var(--ink-soft);font-weight:400}
.pill.open{background:var(--sage-soft);color:var(--sage)}
.pill.soon{background:var(--surface-2);color:var(--ink-soft)}
.sched-more{border-top:1px solid var(--line)}
.cal{color:var(--blue);text-decoration:none;font-weight:700}
.cal:hover{text-decoration:underline}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:11px;font-size:14px;font-weight:700;color:var(--blue);cursor:pointer}
.more:hover{background:var(--surface-2)}
.archive-more{border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.also{margin-top:4px;font-size:12.5px}
.also summary{cursor:pointer;color:var(--blue);list-style:none;display:inline}
.also summary::-webkit-details-marker{display:none}
.also a{display:block;color:var(--ink-soft);text-decoration:none;padding:2px 0}
.also a:hover{color:var(--blue)}

/* 過去のニュース: 日付ごとに開閉 */
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-family:"Zen Maru Gothic",sans-serif;font-weight:700}
.day>summary::-webkit-details-marker{display:none}
.day>summary .c{font-family:"BIZ UDPGothic",sans-serif;font-weight:400;font-size:13px;color:var(--ink-soft);margin-left:auto}
.day>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--ink-soft);border-bottom:2px solid var(--ink-soft);transform:rotate(45deg);margin:0 4px 4px 14px;transition:transform .15s}
.day[open]>summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.day>summary .wd{font-weight:500;color:var(--ink-soft);font-size:14px;margin-left:2px}
.day .rows{border-top:1px solid var(--line)}
.layout.past{gap:10px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;color:var(--ink-soft);font-size:14px;text-align:center}
.empty b{display:block;color:var(--ink);font-family:"Zen Maru Gothic",sans-serif;font-size:16px;margin-bottom:2px}
.result-note{margin:16px 0 0;font-size:13.5px;color:var(--ink-soft)}
.result-note button{border:0;background:none;color:var(--blue);cursor:pointer;padding:0 0 0 8px;font-weight:700}

footer{padding:10px 18px 40px;color:var(--ink-soft);font-size:12.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hello">
    <div class="hello-top">
      <p class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--blue-soft)"/><path d="M7 12h10M12 7v10" stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="bn">診療放射線技師ニュース</span><span class="bs" style="display:none">技師ニュース</span>
      </p>
      <div class="hello-tools">
        <button type="button" class="themebtn" id="focusBtn">担当分野</button>
        <button type="button" class="themebtn" id="themeBtn">表示: 自動</button>
      </div>
    </div>
    <h1 id="today">&nbsp;</h1>
    <p class="sub" id="sub">ニュースを読み込んでいます…</p>
    <p class="stale" id="stale" hidden></p>
  </header>
</div>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="bar-row">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="キーワードで探す" aria-label="キーワードで探す" autocomplete="off">
        <button type="button" class="clear" id="clearQ" aria-label="検索語を消す">✕</button>
      </label>
      <div class="seg" role="group" aria-label="表示する期間">
        <button type="button" data-view="recent" aria-pressed="true">最近</button>
        <button type="button" data-view="past" aria-pressed="false">過去</button>
        <button type="button" data-view="saved" aria-pressed="false">あとで読む<span id="savedCount"></span></button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="分野で絞り込む"></div>
  </div>
</div>

<dialog class="settings" id="focusDlg" aria-labelledby="focusTitle">
  <form method="dialog">
    <h2 id="focusTitle">担当分野</h2>
    <p>選んだ分野の記事は、各欄の上のほうに目印つきで並びます。設定はこの端末に保存されます。</p>
    <div class="focus-grid" id="focusGrid"></div>
    <div class="dlg-actions"><button class="btn" value="cancel">閉じる</button><button class="btn primary" value="save" id="focusSave">保存する</button></div>
  </form>
</dialog>

<main class="wrap">
  <div id="view"></div>
</main>
<footer>毎朝自動で集めた記事です。内容は各リンク先の原文で確認してください。</footer>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=[],meta=null,seminars=[],cat='all',q='',view='recent',showAllSched=false;
const SHOW_LO=6;                    // ほかのニュースは最初に6件だけ
let showAllLo=false;
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
const feedDate=n=>n.featured_date||n.date;
const RECENT_DAYS=7;
const recentCutoff=(()=>{const [y,m,d]=today.split('-').map(Number);return new Date(Date.UTC(y,m-1,d-(RECENT_DAYS-1))).toISOString().slice(0,10);})();
const isRecent=n=>feedDate(n)>=recentCutoff;
const IMP={高:{cls:'hi',label:'要確認'},中:{cls:'mid',label:'お知らせ'},低:{cls:'lo',label:'話題'}};
const impOf=n=>IMP[n.importance]?n.importance:'中';
const CAT_ORDER=['制度','職能','診療報酬・補助金','安全管理','学術','教育','AI','CT','MRI','一般撮影','核医学','放射線治療'];
const WD='日月火水木金土';

// 検索対象は人が読む文字だけ(URL内の英数字に「CT」「AI」が当たらないように)
const searchText=n=>[n.headline,n.summary,n.source,n.category,n.why,(typeof saved!=='undefined'&&saved[n.url]&&saved[n.url].memo)||'',...(Array.isArray(n.also)?n.also.map(a=>a&&a.source):[])].filter(Boolean).join(' ').toLowerCase();
const words=()=>q.toLowerCase().split(/\s+/).filter(Boolean);
const matchQ=n=>!q||words().every(w=>searchText(n).includes(w));
const inView=n=>view==='recent'?isRecent(n):!isRecent(n);

function displayHeadline(n){const h=String(n.headline||''),src=String(n.source||'').trim();const m=h.match(/\s+-\s+([^-]{1,40})$/);const suf=m?m[1].trim():'';const isOutlet=suf&&(suf.toLowerCase()===src.toLowerCase()||/^[\w.-]+\.(jp|com|net|org|vn|info)$/i.test(suf)||/(学会|技師会|新聞|ニュース|NEWS|Web|プレス|タイムズ|TIMES)/i.test(suf));const t=isOutlet?h.slice(0,m.index):h;return t.replace(/^\s*【画像】\s*/,'').replace(/^\s*［(案内板|お知らせ|会告)］\s*/,'');}
function dayText(d){const [y,m,dd]=String(d).split('-').map(Number);if(!y)return esc(d);const dt=new Date(Date.UTC(y,m-1,dd));const diff=Math.round((Date.parse(today+'T00:00:00Z')-dt.getTime())/864e5);if(diff===0)return '今日';if(diff===1)return '昨日';const yr=String(y)!==today.slice(0,4)?`${y}年`:'';return `${yr}${m}/${dd}(${WD[dt.getUTCDay()]})`;}

function alsoHtml(n){const a=Array.isArray(n.also)?n.also.filter(x=>x&&x.url):[];if(!a.length)return '';return `<details class="also"><summary>ほか${a.length}社も報道</summary>${a.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.source||'情報源')}</a>`).join('')}</details>`;}
// ---- 端末内の記録(新着・あとで読む)。保存できない環境でも表示は壊さない ----
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let newSet=new Set();                 // 前回見たあとに増えた記事(URL)
let saved=store.get('rtn-saved',{});  // あとで読む {url: 記事の写し}
function markSeen(){
  const seen=store.get('rtn-seen',null),urls=db.map(n=>n.url).filter(Boolean);
  if(Array.isArray(seen)){const s=new Set(seen);newSet=new Set(urls.filter(u=>!s.has(u)));}
  // その日に新着だった記事は、同じ日に開き直しても新着のまま残す
  const kept=store.get('rtn-new',null);
  if(kept&&kept.date===today&&Array.isArray(kept.urls))kept.urls.forEach(u=>{if(urls.includes(u))newSet.add(u);});
  store.set('rtn-new',{date:today,urls:[...newSet]});
  // 次回のために今の記事を既読として記録(古いものから捨てて最大1000件)
  const merged=[...new Set([...(Array.isArray(seen)?seen:[]),...urls])].slice(-1000);
  store.set('rtn-seen',merged);
}
const isSaved=n=>!!saved[n.url];
function toggleSave(url){
  if(saved[url]){delete saved[url];}
  else{const n=db.find(x=>x.url===url);if(!n)return;const {headline,url:u,source,date,featured_date,category,importance,why,summary}=n;saved[url]={headline,url:u,source,date,featured_date,category,importance,why,summary,savedAt:new Date().toISOString()};}
  store.set('rtn-saved',saved);
}
function saveBtn(n){const on=isSaved(n);return `<button type="button" class="save" data-save="${esc(n.url)}" aria-pressed="${on}" aria-label="${on?'あとで読むから外す':'あとで読むに追加'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>${on?'保存済み':'あとで読む'}</button>`;}
// ---- 月別アーカイブ(news.json の200件より古い記事) ----
let archiveIndex=null, archiveLoaded={}, archiveLoading=false;
async function loadArchiveIndex(){
  if(archiveIndex)return archiveIndex;
  try{const r=await fetch('archive/index.json?'+Date.now());archiveIndex=r.ok?await r.json():{months:[]};}catch(e){archiveIndex={months:[]};}
  if(!Array.isArray(archiveIndex.months))archiveIndex.months=[];
  return archiveIndex;
}
async function loadMonths(months){
  const todo=months.filter(m=>!archiveLoaded[m]);if(!todo.length)return;
  archiveLoading=true;render();
  await Promise.all(todo.map(async m=>{try{const r=await fetch(`archive/${m}.json`);archiveLoaded[m]=r.ok?await r.json():[];}catch(e){archiveLoaded[m]=[];}}));
  archiveLoading=false;render();
}
const nextMonth=()=>archiveIndex&&archiveIndex.months.find(x=>!archiveLoaded[x.month]);
function pastPool(){
  const urls=new Set(db.map(n=>n.url));const extra=[];
  Object.values(archiveLoaded).forEach(list=>(list||[]).forEach(n=>{if(n&&n.url&&!urls.has(n.url)){urls.add(n.url);extra.push(n);}}));
  return db.filter(n=>!isRecent(n)).concat(extra);
}
async function ensureArchiveForView(){
  if(view!=='past')return;
  await loadArchiveIndex();
  // 検索中は全期間から探す
  if(q)await loadMonths(archiveIndex.months.map(x=>x.month));
  else render();
}
// ---- 担当分野(端末に保存) ----
let focusCats=new Set(store.get('rtn-focus',[]));
const isFocus=n=>focusCats.has(n.category);
const focusFirst=(a,b)=>(isFocus(b)-isFocus(a));
function openFocus(){
  const cats=CAT_ORDER.concat(['その他']);
  document.getElementById('focusGrid').innerHTML=cats.map(c=>`<label><input type="checkbox" value="${esc(c)}"${focusCats.has(c)?' checked':''}>${esc(c)}</label>`).join('');
  document.getElementById('focusDlg').showModal();
}
// ---- あとで読むのメモ ----
const memoOf=n=>(saved[n.url]&&saved[n.url].memo)||'';
let memoTimer;
function saveMemo(url,text){if(!saved[url])return;saved[url].memo=text;clearTimeout(memoTimer);memoTimer=setTimeout(()=>store.set('rtn-saved',saved),300);}
let hideNotes=new Set();
function noteHtml(n){return (n.why&&!hideNotes.has(n.why))?`<div class="note"><span class="face" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></span><p class="say"><small>ポイント</small>${esc(n.why)}</p></div>`:'';}
function metaHtml(n,showImp,showDate=true){const i=IMP[impOf(n)];return `<div class="meta">${newSet.has(n.url)?'<span class="pill new">新着</span>':''}${showImp?`<span class="pill ${i.cls}">${i.label}</span>`:''}${isFocus(n)?'<span class="pill focus">担当</span>':''}<span class="pill cat">${esc(n.category||'その他')}</span>${showDate?`<span>${dayText(feedDate(n))}</span>`:''}${saveBtn(n)}</div>`;}
function itemBody(n){return `<a class="title" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(displayHeadline(n))}</a><div class="src">${esc(n.source||'')}</div>${n.summary?`<p class="sum">${esc(n.summary)}</p>`:''}${alsoHtml(n)}`;}
const mustItem=n=>`<article class="must-item">${metaHtml(n,false)}${itemBody(n)}${memoHtml(n)}${noteHtml(n)}</article>`;
const memoHtml=n=>view==='saved'?`<div class="memo"><textarea data-memo="${esc(n.url)}" placeholder="メモ(例: 勉強会で紹介する、あとで添付文書を確認)" aria-label="この記事のメモ">${esc(memoOf(n))}</textarea></div>`:(memoOf(n)?`<div class="memo-line"><b>メモ</b>${esc(memoOf(n))}</div>`:'');
const row=(n,showImp=false,showDate=true)=>`<article class="row">${metaHtml(n,showImp,showDate)}${itemBody(n)}${memoHtml(n)}${noteHtml(n)}</article>`;
const byNewest=(a,b)=>feedDate(b).localeCompare(feedDate(a));

function renderChips(){
  const base=(view==='saved'?savedList():view==='past'?pastPool():db.filter(inView)).filter(matchQ);const cnt={};base.forEach(n=>{cnt[n.category]=(cnt[n.category]||0)+1});
  const cats=CAT_ORDER.filter(c=>cnt[c]).concat(Object.keys(cnt).filter(c=>!CAT_ORDER.includes(c)&&c!=='その他').sort()).concat(cnt['その他']?['その他']:[]);
  if(cat!=='all'&&!cats.includes(cat))cats.push(cat);
  const b=(c,label,k)=>`<button type="button" data-cat="${esc(c)}" aria-pressed="${cat===c}" class="${focusCats.has(c)?'is-focus':''}">${esc(label)}<span class="n">${k}</span></button>`;
  document.getElementById('chips').innerHTML=b('all','すべて',base.length)+cats.map(c=>b(c,c,cnt[c]||0)).join('');
}

function filterNote(total){
  const parts=[];if(q)parts.push(`「${esc(q)}」`);if(cat!=='all')parts.push(esc(cat));
  return parts.length?`<p class="result-note">${parts.join('と')}で絞り込み中、${total}件<button type="button" data-reset>解除する</button></p>`:'';
}

const NEAR=['大阪','兵庫','京都','滋賀','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知'];
function calLink(n){const d=n.event_date.replace(/-/g,'');const [y,m,dd]=n.event_date.split('-').map(Number);const next=new Date(Date.UTC(y,m-1,dd+1)).toISOString().slice(0,10).replace(/-/g,'');const t=(n.event_kind==='申込締切'?'【申込締切】':'')+(n.title||displayHeadline(n));const det=(n.url||'')+(n.apply_end?`\n申込締切: ${n.apply_end}`:'');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t)+'&dates='+d+'/'+next+'&details='+encodeURIComponent(det);}
const SEM_CAT={告示研修:'職能',生涯教育:'教育',認定資格:'教育'};
const md=d=>{const [,m,dd]=String(d).split('-').map(Number);return `${m}/${dd}`;};
const normTitle=t=>String(t||'').replace(/\s+-\s+[^-]{1,40}$/,'').replace(/[\s（）()]/g,'');
function scheduleItems(){
  const out=[],seen=new Set();
  // 技師会の研修一覧(受付状態・申込締切つき)。何か月も続く常設講座と受付終了は除く
  seminars.forEach(x=>{
    if(!x.event_start||(x.event_end||x.event_start)<today)return;
    const span=(Date.parse(x.event_end||x.event_start)-Date.parse(x.event_start))/864e5;
    if(span>60||/申込み不可|受付終了|満員|定員/.test(x.status||''))return;
    const it={event_date:x.event_start<today?today:x.event_start,event_kind:'開催',title:x.title,url:x.url,event_place:/^jart$/i.test(String(x.place||'').trim())?'':String(x.place||'').replace(/(都|府|県)$/,''),status:x.status,apply_start:x.apply_start,apply_end:x.apply_end,category:SEM_CAT[x.kind]||'教育',source:'日本診療放射線技師会',headline:x.title};
    seen.add(normTitle(x.title));seen.add(x.url);out.push(it);
  });
  // ニュース記事から読み取った日程(研修一覧と重複するものは除く)
  db.forEach(n=>{if(n.event_date&&n.event_date>=today&&!seen.has(n.url)&&!seen.has(normTitle(displayHeadline(n))))out.push(n);});
  return out.filter(n=>matchQ(n)&&(cat==='all'||n.category===cat)).sort((a,b)=>a.event_date.localeCompare(b.event_date));
}
function statusHtml(n){
  if(n.status==='申込み可')return `<span class="pill open">受付中${n.apply_end?`・${md(n.apply_end)}まで`:''}</span>`;
  if(n.status==='受付前')return `<span class="pill soon">受付前${n.apply_start?`・${md(n.apply_start)}から`:''}</span>`;
  return '';
}
function renderSchedule(){
  const all=scheduleItems();if(!all.length)return '';
  const items=showAllSched?all:all.slice(0,6);
  return `<section class="section" aria-labelledby="h-sched"><h2 id="h-sched">これからの日程<span class="count">${all.length}件</span></h2><p class="lead">技師会の研修一覧と、案内記事に書かれた開催日・申込締切を近い順に並べています</p><div class="sched">${items.map(n=>{const [y,m,d]=n.event_date.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));const left=Math.round((dt-Date.parse(today+'T00:00:00Z'))/864e5);const dl=n.event_kind==='申込締切';const pl=n.event_place;const plHtml=pl?(pl==='オンライン'?'<span class="pill near">オンライン</span>':NEAR.includes(pl)?`<span class="pill near">${esc(pl)}(近畿・中四国)</span>`:`<span class="pill place">${esc(pl)}</span>`):'';return `<article class="sched-item"><div class="sched-date${dl?' deadline':''}"><span class="md">${m}/${d}</span><span class="wd">${WD[dt.getUTCDay()]}曜</span></div><div class="sched-body"><div class="kind">${dl?'<b>申込締切</b>':'開催'}　${left===0?'今日':`あと${left}日`}</div><a class="title" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title||displayHeadline(n))}</a><div class="sched-tools">${statusHtml(n)}${plHtml}<a class="cal" href="${calLink(n)}" target="_blank" rel="noopener">Googleカレンダーに追加</a></div></div></article>`;}).join('')}${all.length>items.length?`<button type="button" class="more sched-more" data-allsched>残り${all.length-items.length}件の日程を見る</button>`:''}</div></section>`;
}
function renderRecent(list){
  const ord=(a,b)=>focusFirst(a,b)||byNewest(a,b);
  const hi=list.filter(n=>impOf(n)==='高').sort(ord),mid=list.filter(n=>impOf(n)==='中').sort(ord),lo=list.filter(n=>impOf(n)==='低').sort(ord);
  const loShown=(showAllLo||q||cat!=='all')?lo:lo.slice(0,SHOW_LO);
  // 同じ一言が3件以上並ぶときは、各記事ではなく見出しの下に1回だけ出す
  const nc={};mid.forEach(n=>{if(n.why)nc[n.why]=(nc[n.why]||0)+1});
  const shared=Object.keys(nc).filter(w=>nc[w]>=3);
  hideNotes=new Set(shared);
  const sharedNotes=shared.map(w=>`<div class="note shared"><span class="face" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></span><p class="say"><small>ポイント(${nc[w]}件に共通)</small>${esc(w)}</p></div>`).join('');
  const must=hi.length?`<div class="must">${hi.map(mustItem).join('')}</div>`:`<div class="empty"><b>${q||cat!=='all'?'条件に合う確認事項はありません':'今週は急ぎの確認事項はありません'}</b>制度の変更や薬剤の供給停止などが出たら、ここに表示します。</div>`;
  return `${filterNote(list.length)}<div class="layout recent">
    <div class="main">
      <section class="section" aria-labelledby="h-hi"><h2 id="h-hi">確認しておきたいこと<span class="count">${hi.length}件</span></h2><p class="lead">制度・診療報酬、安全情報、薬剤の供給など、部署で対応が必要になりそうなもの</p>${must}</section>
      ${renderSchedule()}
      <section class="section" aria-labelledby="h-mid"><h2 id="h-mid">研修・学会のお知らせ<span class="count">${mid.length}件</span></h2><p class="lead">学会・技師会・行政からの案内と、国内の新しい装置の話題</p>${sharedNotes}${mid.length?`<div class="list">${mid.map(n=>row(n)).join('')}</div>`:`<div class="empty">この期間のお知らせはありません。</div>`}</section>
    </div>
    <aside class="side section" aria-labelledby="h-lo"><h2 id="h-lo">ほかのニュース<span class="count">${lo.length}件</span></h2><p class="lead">一般メディアの医療・放射線の話題</p>${lo.length?`<div class="list">${loShown.map(n=>row(n)).join('')}${loShown.length<lo.length?`<button type="button" class="more" data-more>残り${lo.length-loShown.length}件を見る</button>`:''}</div>`:`<div class="empty">この期間のニュースはありません。</div>`}</aside>
  </div>`;
}

function archiveMoreHtml(){
  if(archiveLoading)return '<div class="empty">前の月の記事を読み込んでいます…</div>';
  const nm=nextMonth();if(!nm)return archiveIndex&&archiveIndex.months.length?'<p class="lead" style="text-align:center;margin-top:6px">保存しているいちばん古い記事までを表示しています。</p>':'';
  const [y,m]=nm.month.split('-').map(Number);
  return `<button type="button" class="more archive-more" data-month="${esc(nm.month)}">さらに前を読み込む(${y}年${m}月・${nm.count}件)</button>`;
}
function renderPast(list){
  hideNotes=new Set();
  if(!list.length)return `${filterNote(0)}<div class="layout"><div class="empty"><b>見つかりませんでした</b>キーワードを短くするか、分野を「すべて」に戻してください。</div>${archiveMoreHtml()}</div>`;
  const by={};list.forEach(n=>{(by[feedDate(n)]=by[feedDate(n)]||[]).push(n)});
  const narrowed=q||cat!=='all';
  const order={高:0,中:1,低:2};
  return `${filterNote(list.length)}<div class="layout past">${Object.keys(by).sort((a,b)=>b.localeCompare(a)).map((d,i)=>{const items=by[d].sort((a,b)=>order[impOf(a)]-order[impOf(b)]);const [y,m,dd]=d.split('-').map(Number);const wd=WD[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];const yr=String(y)!==today.slice(0,4)?`${y}年`:'';return `<details class="day"${(narrowed||i===0)?' open':''}><summary><span>${yr}${m}月${dd}日<span class="wd">(${wd})</span></span><span class="c">${items.length}件</span></summary><div class="rows">${items.map(n=>row(n,true,false)).join('')}</div></details>`;}).join('')}${archiveMoreHtml()}</div>`;
}

function savedList(){
  // 元データに残っていれば最新の内容、消えていれば保存時の写しを使う
  return Object.values(saved).map(c=>Object.assign({},c,db.find(n=>n.url===c.url)||{},{savedAt:c.savedAt})).sort((a,b)=>String(b.savedAt).localeCompare(String(a.savedAt)));
}
function renderSaved(list){
  hideNotes=new Set();
  if(!Object.keys(saved).length)return `<div class="layout"><div class="empty"><b>あとで読む記事はまだありません</b>記事の右上の「あとで読む」を押すと、ここに集まります。</div></div>`;
  if(!list.length)return `${filterNote(0)}<div class="layout"><div class="empty"><b>条件に合う記事はありません</b>絞り込みを解除してください。</div></div>`;
  return `${filterNote(list.length)}<div class="layout"><section class="section" aria-labelledby="h-saved"><div class="saved-tools"><h2 id="h-saved">あとで読む<span class="count">${list.length}件</span></h2></div><p class="lead">保存した順に新しいものから並んでいます。この端末のブラウザにだけ記録されます。</p><div class="list">${list.map(n=>row(n,true)).join('')}</div></section></div>`;
}
function render(){
  renderChips();
  const pool=view==='saved'?savedList():view==='past'?pastPool():db.filter(inView);
  const list=pool.filter(n=>matchQ(n)&&(cat==='all'||n.category===cat));
  document.getElementById('view').innerHTML=view==='recent'?renderRecent(list):view==='past'?renderPast(list):renderSaved(list);
  const sc=Object.keys(saved).length;document.getElementById('savedCount').textContent=sc?` ${sc}`:'';
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
  document.getElementById('clearQ').classList.toggle('show',!!q);
}

function renderHello(){
  const [y,m,d]=today.split('-').map(Number);const wd=WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  document.getElementById('today').innerHTML=`${m}月${d}日<span class="wd">${wd}曜日</span>`;
  const hi=db.filter(n=>isRecent(n)&&impOf(n)==='高').length;
  let upd='';
  if(meta&&meta.checked_at){const t=new Date(meta.checked_at);if(!isNaN(t)){const hm=t.toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'numeric',minute:'2-digit'});const sameDay=t.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'})===today;upd=`${sameDay?'今日':t.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'})} ${hm}に更新。`;}}
  // 自動更新が止まっていたら知らせる(最終更新から36時間以上)
  const st=document.getElementById('stale');const t0=meta&&meta.checked_at?new Date(meta.checked_at):null;
  const hours=t0&&!isNaN(t0)?(Date.now()-t0.getTime())/36e5:Infinity;
  if(hours>=36){st.hidden=false;st.innerHTML=t0&&!isNaN(t0)?`<b>自動更新が止まっています。</b>最後の更新は${t0.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'})}(${Math.floor(hours/24)}日前)です。新しい記事が反映されていない可能性があります。`:'<b>更新時刻を確認できませんでした。</b>新しい記事が反映されていない可能性があります。';}
  document.getElementById('sub').textContent=`${newSet.size?`前回から${newSet.size}件増えました。`:''}${hi?`この1週間に確認しておきたいことが${hi}件あります。`:'この1週間、急ぎの確認事項はありません。'}${upd}`;
}

// 操作
let qTimer;
document.getElementById('q').addEventListener('input',e=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{q=e.target.value.trim();render();ensureArchiveForView();},120);});
document.getElementById('clearQ').onclick=()=>{const i=document.getElementById('q');i.value='';q='';render();i.focus();};
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;render();ensureArchiveForView();});
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;cat=b.dataset.cat;render();});
document.getElementById('view').addEventListener('click',e=>{
  const sb=e.target.closest('[data-save]');if(sb){toggleSave(sb.dataset.save);render();return;}
  const am=e.target.closest('[data-month]');if(am){loadMonths([am.dataset.month]);return;}
  if(e.target.closest('[data-allsched]')){showAllSched=true;render();return;}
  if(e.target.closest('[data-more]')){showAllLo=true;render();return;}
  if(e.target.closest('[data-reset]')){cat='all';q='';document.getElementById('q').value='';render();}
});
document.getElementById('view').addEventListener('input',e=>{const t=e.target.closest('textarea[data-memo]');if(t)saveMemo(t.dataset.memo,t.value);});
document.getElementById('focusBtn').onclick=openFocus;
document.getElementById('focusDlg').addEventListener('close',()=>{const d=document.getElementById('focusDlg');if(d.returnValue!=='save')return;focusCats=new Set([...d.querySelectorAll('input:checked')].map(i=>i.value));store.set('rtn-focus',[...focusCats]);updateFocusBtn();render();});
function updateFocusBtn(){const fb=document.getElementById('focusBtn');fb.textContent=focusCats.size?`担当分野(${focusCats.size})`:'担当分野';fb.title=focusCats.size?[...focusCats].join('、'):'担当分野を設定する';}
updateFocusBtn();
// 上部バーが本文に重なったら境界線を出す
const bar=document.getElementById('bar');
if('IntersectionObserver' in window){new IntersectionObserver(([en])=>bar.classList.toggle('stuck',!en.isIntersecting)).observe(document.querySelector('.hello'));}

// 表示テーマ(自動/ライト/ダーク)。選んだものは次回も使う
(function(){const btn=document.getElementById('themeBtn');const modes=['auto','light','dark'],label={auto:'表示: 自動',light:'表示: ライト',dark:'表示: ダーク'};let mode='auto';try{const t=localStorage.getItem('rtn-theme');if(modes.includes(t))mode=t;}catch(e){}const apply=()=>{if(mode==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=mode;btn.textContent=label[mode];try{if(mode==='auto')localStorage.removeItem('rtn-theme');else localStorage.setItem('rtn-theme',mode);}catch(e){}};btn.onclick=()=>{mode=modes[(modes.indexOf(mode)+1)%modes.length];apply();};apply();})();

if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
Promise.all([
  fetch('news.json?'+Date.now()).then(r=>r.json()),
  fetch('news_meta.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('seminars.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([x,m,sem])=>{db=Array.isArray(x)?x:[];meta=m;seminars=sem&&Array.isArray(sem.items)?sem.items:[];markSeen();renderHello();render();})
.catch(()=>{document.getElementById('sub').textContent='ニュースを読み込めませんでした。';document.getElementById('view').innerHTML='<div class="layout"><div class="empty"><b>読み込みに失敗しました</b>通信状況を確認して、ページを再読み込みしてください。</div></div>';});
