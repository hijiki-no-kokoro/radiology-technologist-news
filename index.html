<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>診療放射線技師ニュース</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#182230}
header{padding:28px 18px;background:linear-gradient(135deg,#102a43,#1f6f8b);color:#fff}header h1{margin:0 0 7px;font-size:28px}header p{margin:0;opacity:.9}
main{max-width:1050px;margin:auto;padding:18px}.title{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.title h2{margin:0}.badge,.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f1ff;color:#1755a5;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 14px #16324d12;border:1px solid #e5ebf2;border-left:5px solid #1f6f8b}
.meta{display:flex;gap:7px;flex-wrap:wrap;color:#6b7785;font-size:12px}.high{background:#ffe7e7;color:#b42318}.mid{background:#fff2cc;color:#8a5b00}h2{font-size:18px;line-height:1.45;margin:12px 0 8px}p{line-height:1.7}.why{background:#f7fafc;border-radius:10px;padding:10px;margin:12px 0;font-size:14px;line-height:1.6}.why b{display:block;color:#1f6f8b;margin-bottom:3px}a{color:#1769aa;text-decoration:none;font-weight:600}.notice{background:#fff8df;border:1px solid #f0df9c;padding:13px;border-radius:12px;margin:15px 0;line-height:1.6}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters button{border:1px solid #d5dee8;background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer}.filters button.active{background:#1f6f8b;color:#fff;border-color:#1f6f8b}.empty{padding:30px;text-align:center;color:#687787}.search{width:100%;padding:12px;border:1px solid #d5dee8;border-radius:10px;font-size:15px}footer{text-align:center;color:#74808c;font-size:12px;padding:30px}
</style>
</head>
<body>
<header><h1>📡 診療放射線技師ニュース</h1><p>制度・学術・AI・画像診断・安全管理などを毎日チェック</p></header>
<main>
<div class="title"><h2>🔥 今日の重要ニュース</h2><span class="badge" id="today"></span></div>
<div class="notice" id="status">毎朝8:00にニュースDBを更新します。</div>
<div class="filters"><button class="active" data-cat="all">すべて</button><button data-cat="制度">制度</button><button data-cat="職能">職能</button><button data-cat="学術">学術</button><button data-cat="AI">AI</button><button data-cat="CT">CT</button><button data-cat="MRI">MRI</button><button data-cat="一般撮影">一般撮影</button><button data-cat="安全管理">安全管理</button><button data-cat="核医学">核医学</button><button data-cat="放射線治療">放射線治療</button><button data-cat="教育">教育</button><button data-cat="診療報酬・補助金">診療報酬・補助金</button></div>
<input class="search" id="search" placeholder="ニュースを検索（AI、MRI、補助金、被ばく…）">
<div class="grid" id="todayGrid"></div>
<div class="title" style="margin-top:32px"><h2>🗄️ 過去ニュースDB</h2><span class="badge" id="count"></span></div>
<div class="grid" id="pastGrid"></div>
</main><footer>Radiology Technologist News</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
let db=[],cat='all',q='';
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});document.getElementById('today').textContent=today.replaceAll('-','/');
function card(n){const imp=n.importance||'中';const cls=imp==='高'?'high':'mid';return `<article class="card"><div class="meta"><span class="tag">${esc(n.category)}</span><span class="tag ${cls}">重要度 ${esc(imp)}</span><span>${esc(n.date)}</span></div><h2>${esc(n.headline)}</h2><p>${esc(n.summary)}</p><div class="why"><b>技師長目線</b>${esc(n.why)}</div><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.source||'公式情報')} ↗</a></article>`}
function render(){
  const list=db.filter(n=>(cat==='all'||n.category===cat)&&(!q||JSON.stringify(n).toLowerCase().includes(q.toLowerCase())));
  const todays=list.filter(n=>n.date===today);
  const past=list.filter(n=>n.date!==today);
  document.getElementById('todayGrid').innerHTML=todays.map(card).join('')||'<div class="empty">本日のニュースはまだありません。</div>';
  document.getElementById('pastGrid').innerHTML=past.map(card).join('')||'<div class="empty">過去ニュースはありません。</div>';
  document.getElementById('count').textContent=`${db.length}件蓄積`;
}
fetch('news.json?'+Date.now()).then(r=>r.json()).then(x=>{db=x;document.getElementById('status').textContent=`毎朝8:00に更新中。現在 ${db.length}件のニュースを蓄積しています。`;render()}).catch(e=>{document.getElementById('status').textContent='ニュースDBの読み込みに失敗しました。';render()});
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});document.getElementById('search').oninput=e=>{q=e.target.value;render()};
</script>
</body></html>
